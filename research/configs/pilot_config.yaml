# FairLens AI Research — Empirical Pilot Configuration (Phase 2)
# Designed for method validation and evaluator stress-testing before full experiment.
# Focus: 2 Datasets x 2 Models x 2 Mitigations x 3 Seeds = 24 conditions.

pilot_metadata:
  purpose: "Method validation and failure inspection on real LLM explanations"
  execution_mode: "PILOT_VALIDATION_RUN"
  output_dir: "research/results/pilot"

matrix:
  datasets:
    - "adult"
    - "compas"

  models:
    - "logistic_regression"
    - "random_forest"

  mitigations:
    - "correlation_remover"
    - "threshold_optimizer"

  seeds:
    - 42
    - 123
    - 456

llm_configuration:
  provider: "gemini"               # Can be overridden to "mock" for dry run
  default_model: "gemini-2.5-flash"
  temperature: 0.2
  max_output_tokens: 1500
  top_p: 0.95
  prompts:
    - "combined_audit_v1"

evaluator_tolerances:
  absolute_tolerance: 0.015
  relative_tolerance: 0.05
  top_k_features: 5
